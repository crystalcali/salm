[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salm-lab"
version = "0.1.0"
description = "Research and visualization toolkit for LFM3 on DGX Spark"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
lab = [
  "torch>=2.7",
  "transformers>=5.12.1",
  "accelerate>=1.6",
  "safetensors>=0.5",
  "streamlit>=1.40",
  "plotly>=5.24",
  "pandas>=2.1",
  "peft>=0.16",
  "datasets>=3.4",
]
dev = ["pytest>=8", "ruff>=0.7"]
text-jepa-v5 = [
  "torch>=2.7",
  "transformers>=4.46,<6",
  "tokenizers>=0.20",
  "datasets>=3.4,<6",
  "huggingface_hub>=0.30,<2",
  "matplotlib>=3.8",
  "scipy>=1.12",
  "scikit-learn>=1.4",
]

[project.scripts]
salm = "salm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
